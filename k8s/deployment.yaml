apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-fiapx-processing-service
  namespace: fiapx
  labels:
    app: tc-fiapx-processing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-fiapx-processing-service
  template:
    metadata:
      labels:
        app: tc-fiapx-processing-service
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: tc-fiapx-processing-service
          image: ghcr.io/rtmaraujo/tc-fiapx-processing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: processing-service-config
            - secretRef:
                name: processing-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 5Gi
