apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tc-fiapx-processing-service
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tc-fiapx-processing-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
