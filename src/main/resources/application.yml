server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: tc-fiapx-processing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fiapx_processing}
    username: ${DB_USER:fiapx_processing_user}
    password: ${DB_PASSWORD:fiapx_processing_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 60s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:fiapx-processing-group}
      auto-offset-reset: earliest
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 900000
        session.timeout.ms: 30000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record

fiapx:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    access-key: ${STORAGE_ACCESS_KEY:fiapx}
    secret-key: ${STORAGE_SECRET_KEY:fiapx12345}
    bucket: ${STORAGE_BUCKET:fiapx-videos}
  ffmpeg:
    binary: ${FFMPEG_BINARY:ffmpeg}
    fps: ${FFMPEG_FPS:1}
    qualidade: ${FFMPEG_QUALIDADE:2}
    log-level: ${FFMPEG_LOG_LEVEL:error}
    timeout-seconds: ${FFMPEG_TIMEOUT_SECONDS:600}
  kafka:
    topics:
      solicitado: ${KAFKA_TOPIC_SOLICITADO:fiapx.video.solicitado}
      processado: ${KAFKA_TOPIC_PROCESSADO:fiapx.video.processado}
      falha: ${KAFKA_TOPIC_FALHA:fiapx.video.falha}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.fiapx.processing: ${LOG_LEVEL:INFO}
    org.apache.kafka: WARN
